<mat-toolbar color="primary" class="main-toolbar" *ngIf="authService.isAuthenticated()">
  <mat-icon class="toolbar-icon" style="margin-right: 12px;">verified_user</mat-icon>
  <span class="toolbar-title">{{ title }}</span>
  <span style="flex: 1 1 auto;"></span>
  <span class="toolbar-email" style="font-size: 14px; margin-right: 16px;">{{ authService.currentUser()?.email }}</span>
  <button mat-icon-button (click)="authService.logout()">
    <mat-icon class="toolbar-icon">logout</mat-icon>
  </button>
</mat-toolbar>

<main [style.padding]="authService.isAuthenticated() ? '24px' : '0'" style="max-width: 1200px; margin: 0 auto;">
  <router-outlet></router-outlet>
</main>
