<mat-toolbar color="primary" style="background-color: var(--primary-color);" *ngIf="authService.isAuthenticated()">
  <mat-icon style="margin-right: 12px;">verified_user</mat-icon>
  <span>{{ title }}</span>
  <span style="flex: 1 1 auto;"></span>
  <span style="font-size: 14px; margin-right: 16px;">{{ authService.currentUser()?.email }}</span>
  <button mat-icon-button (click)="authService.logout()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<main [style.padding]="authService.isAuthenticated() ? '24px' : '0'" style="max-width: 1200px; margin: 0 auto;">
  <router-outlet></router-outlet>
</main>
