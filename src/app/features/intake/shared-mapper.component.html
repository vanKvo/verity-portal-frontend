<mat-card class="mapper-card">
  <mat-card-header>
    <mat-card-subtitle>Map your uploaded file columns to system attributes</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content style="margin-top: 16px;">
    <div *ngIf="missingRequiredFields().length > 0" class="manual-mapping-prompt" style="color: #c62828; background-color: #ffebee; border: 1px solid #ffcdd2; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
      <mat-icon style="font-size: 20px; width: 20px; height: 20px; color: #c62828;">warning</mat-icon>
      <span>Some required fields could not be matched automatically. Please review the mappings. Missing: {{ missingRequiredFields().join(', ') }}</span>
    </div>
    <table mat-table [dataSource]="headers()" class="full-width">
      <!-- Original Header Column -->
      <ng-container matColumnDef="original">
        <th mat-header-cell *matHeaderCellDef>Source Column</th>
        <td mat-cell *matCellDef="let header"> {{ header }} </td>
      </ng-container>

      <!-- Mapping Column -->
      <ng-container matColumnDef="mapping">
        <th mat-header-cell *matHeaderCellDef>Maps To</th>
        <td mat-cell *matCellDef="let header">
          <mat-form-field appearance="outline">
            <mat-select [value]="mappings()[header]" (selectionChange)="updateMapping(header, $event.value)">
              <mat-option *ngFor="let field of getAvailableOptions(header)" [value]="field">
                {{ field }}
                <span *ngIf="isRequired(field)" class="required-asterisk" style="color: red; margin-left: 4px;">*</span>
              </mat-option>
              <mat-option [value]="''">-- Ignore --</mat-option>
            </mat-select>
          </mat-form-field>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['original', 'mapping']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['original', 'mapping'];"></tr>
    </table>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button (click)="applyAutofill()" *ngIf="suggestions().length > 0">
      <mat-icon>auto_fix_high</mat-icon>
      Autofill High Confidence
    </button>
    <button mat-button color="warn">Cancel</button>
    <button mat-raised-button color="primary" [disabled]="!isReady() || isProcessing()" (click)="submitMappings()">
      <mat-icon *ngIf="!isProcessing()">check_circle</mat-icon>
      <mat-spinner diameter="20" *ngIf="isProcessing()" style="display: inline-block; margin-right: 8px;"></mat-spinner>
      {{ isProcessing() ? 'Processing...' : 'Confirm & Process' }}
    </button>
  </mat-card-actions>
</mat-card>
