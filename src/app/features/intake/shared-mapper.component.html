<mat-card class="mapper-card">
  <mat-card-header>
    <mat-card-title>Data Header Mapping</mat-card-title>
    <mat-card-subtitle>Map your uploaded file columns to system attributes</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="headers()" class="full-width">
      <!-- Original Header Column -->
      <ng-container matColumnDef="original">
        <th mat-header-cell *matHeaderCellDef>Source Column</th>
        <td mat-cell *matCellDef="let header"> {{ header }} </td>
      </ng-container>

      <!-- Mapping Column -->
      <ng-container matColumnDef="mapping">
        <th mat-header-cell *matHeaderCellDef>Maps To</th>
        <td mat-cell *matCellDef="let header">
          <mat-form-field appearance="outline">
            <mat-select [value]="mappings()[header]" (selectionChange)="updateMapping(header, $event.value)">
              <mat-option *ngFor="let field of targetFields()" [value]="field">
                {{ field }}
              </mat-option>
              <mat-option [value]="''">-- Ignore --</mat-option>
            </mat-select>
          </mat-form-field>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['original', 'mapping']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['original', 'mapping'];"></tr>
    </table>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button color="warn">Cancel</button>
    <button mat-raised-button color="primary" [disabled]="!isReady()" (click)="submitMappings()">
      <mat-icon>check_circle</mat-icon>
      Confirm & Process
    </button>
  </mat-card-actions>
</mat-card>
